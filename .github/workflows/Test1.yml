name: Preflight2

on:
  push:
    branches:
      - release

jobs:
  preflight-job:
    name: Preflight Step
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set Git user
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@test.com"
      
      - name: Bump version
        run: |
          npm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore: tes test [skip ci]"
          git push
